name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar
        run: dotnet restore HomelabMonitor.slnx
      - name: Compilar
        run: dotnet build HomelabMonitor.slnx --no-restore -c Release
      - name: Tests
        run: dotnet test HomelabMonitor.slnx --no-build -c Release --logger "console;verbosity=normal"
